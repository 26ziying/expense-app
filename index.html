<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>小帳本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@300;400;500;700&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --sage:#9aaa94;--sage-d:#7d9477;--sage-l:#ccd5c9;--sage-p:#edf0ec;
  --blush:#c4a090;--blush-l:#e2ccc4;--blush-p:#f6eeeb;
  --income:#7fa896;--income-p:#e4f0ed;--income-d:#3a7060;
  --ink:#3e3a36;--ink-m:#7a736c;--ink-s:#a8a09a;
  --bg:#f2ede8;--surface:#faf7f4;--white:#fff;
  --r:16px;--rs:12px;--nav-h:68px;
  --ft:'Zen Maru Gothic',sans-serif;
  --fb:'Noto Sans TC',sans-serif;
}
html,body{height:100%;background:var(--bg)}
body{font-family:var(--fb);background:var(--bg);color:var(--ink);height:100%;max-width:480px;margin:0 auto;position:relative;overflow:hidden;font-weight:bold}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh}
.screen{display:none;flex-direction:column;flex:1;min-height:0}
.screen.active{display:flex}
.scroll{flex:1;overflow-y:auto;padding:20px 16px 24px;-webkit-overflow-scrolling:touch;background:var(--bg)}
.scroll::-webkit-scrollbar{display:none}

/* Topbar */
.topbar{
  position: relative;
  padding: calc(env(safe-area-inset-top,0px) + 14px) 2px 2px;
  flex-shrink: 0;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  overflow: hidden;
  z-index: 5;

  min-height: 70px;

  /* 關鍵：直接做弧形 */
  border-bottom-left-radius: 50% 120%;
  border-bottom-right-radius: 50% 120%;
}

.ms-item{
  font-family:var(--ft);font-size:17px;
  color:var(--ink);
  letter-spacing:.5px;
  padding:6px 16px;
  border-radius:20px;
  cursor:pointer;
  transition:all .2s;
  border:1.5px solid transparent;
  white-space:nowrap;
}
.ms-item.active{
  color:var(--ink);
  border:1px solid var(--ink);
  background:rgba(62,58,54,0.1);
  backdrop-filter: blur(6px);
  font-size:18px;
}
.ms-item:not(.active):active{color:var(--ink)}

.month-slider{
  display:flex;align-items:center;gap:6px;
  position:relative;z-index:2;
  padding-bottom:20px;
}


/* Bottom nav */
.bottom-nav{background:var(--white);border-top:1px solid rgba(0,0,0,.07);display:flex;flex-shrink:0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 10px);height:calc(var(--nav-h) + 10px);z-index:10;transform:translateY(-0.2cm)}
.nav-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;border:none;background:transparent;padding:8px 0}
.nav-tab-icon{font-size:20px;line-height:1;transition:transform .15s;color:#000}
.nav-tab-label{font-size:12px;color:#000;letter-spacing:.5px;font-family:var(--ft);display:none}
.nav-tab.active .nav-tab-label{color:#000;font-weight:500}
.nav-tab.active .nav-tab-icon{transform:scale(1.1)}
.nav-center{flex:1;display:flex;align-items:center;justify-content:center}
.fab{width:52px;height:52px;border-radius:16px;background:var(--sage);color:#fff;border:none;font-size:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 18px rgba(154,170,148,.55);margin-bottom:6px;transition:transform .15s}
.fab:active{transform:scale(.93)}

/* Cards */
.card{background:var(--white);border-radius:var(--r);padding:16px;margin-bottom:12px;border:1px solid rgba(0,0,0,.04)}
.card-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.card-title{font-size:14px;color:var(--ink-s);letter-spacing:2px;font-family:var(--ft)}
.see-all{font-size:14px;color:var(--sage-d);cursor:pointer}

/* Hero */
.hero{background:linear-gradient(135deg,#c8d3c5,#b5c8bf,#a5b8c8);border-radius:20px;padding:20px 20px 16px;margin-bottom:12px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-40px;right:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.1)}
.hero-lbl{font-size:14px;color:rgba(255,255,255,.8);letter-spacing:2px;margin-bottom:5px;font-family:var(--ft)}
.hero-amount{font-family:var(--ft);font-size:34px;color:#fff;font-weight:400;line-height:1}
.hero-cur{font-size:17px;opacity:.85;margin-right:3px}
.prog-wrap{background:rgba(255,255,255,.25);border-radius:4px;height:4px;margin:12px 0 10px;overflow:hidden}
.prog-fill{height:100%;border-radius:4px;background:rgba(255,255,255,.85);transition:width .6s}
.hero-row{display:flex}
.hero-stat{flex:1;padding:0 10px;border-left:1px solid rgba(255,255,255,.2)}
.hero-stat:first-child{padding-left:0;border-left:none}
.hero-stat-lbl{font-size:12px;color:rgba(255,255,255,.7);letter-spacing:1px;margin-bottom:2px}
.hero-stat-val{font-size:16px;color:#fff;font-family:var(--ft)}

/* IE strip */
.ie-strip{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.ie-box{border-radius:var(--r);padding:13px;border:1px solid rgba(0,0,0,.04)}
.ie-box.exp{background:var(--white)}
.ie-box.inc{background:var(--income-p);border-color:rgba(127,168,150,.2)}
.ie-lbl{font-size:13px;letter-spacing:1px;margin-bottom:4px;font-family:var(--ft)}
.ie-box.exp .ie-lbl{color:var(--ink-s)}
.ie-box.inc .ie-lbl{color:var(--income-d)}
.ie-val{font-family:var(--ft);font-size:19px}
.ie-box.exp .ie-val{color:var(--blush)}
.ie-box.inc .ie-val{color:var(--income-d)}
.ie-hint{font-size:13px;color:var(--ink-s);margin-top:3px}

/* Stat strip */
.stat-strip{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat-box{background:var(--white);border-radius:var(--r);padding:13px;border:1px solid rgba(0,0,0,.04)}
.stat-lbl{font-size:13px;color:var(--ink-s);letter-spacing:1px;margin-bottom:4px;font-family:var(--ft)}
.stat-val{font-family:var(--ft);font-size:20px;color:var(--ink)}
.stat-hint{font-size:13px;color:var(--ink-s);margin-top:3px}

/* Bank group rows (總覽) */
.bank-item{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid rgba(0,0,0,.05);cursor:pointer;transition:opacity .1s}
.bank-item:active{opacity:.7}
.bank-item:last-child{border-bottom:none}
.bank-icon{width:36px;height:36px;border-radius:10px;background:var(--sage-p);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.bank-info{flex:1;margin-left:10px;min-width:0}
.bank-name{font-size:17px;color:var(--ink);font-family:var(--ft)}
.bank-count{font-size:14px;color:var(--ink-s);margin-top:2px}
.bank-amount{font-family:var(--ft);font-size:15px;color:var(--blush)}
.bank-amount.inc{color:var(--income-d)}
.bank-chevron{font-size:14px;color:var(--ink-s);margin-left:8px}

/* Records — 3-level */
.rec-item{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid rgba(0,0,0,.05);cursor:pointer;transition:opacity .1s}
.rec-item:active{opacity:.7}
.rec-item:last-child{border-bottom:none;padding-bottom:0}
.rec-icon{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.rec-info{flex:1;min-width:0}
.rec-store{font-size:17px;color:var(--ink);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--ft)}
.rec-meta{font-size:14px;color:var(--ink-s);margin-top:2px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.rec-right{text-align:right;flex-shrink:0}
.rec-amount{font-family:var(--ft);font-size:18px}
.rec-amount.exp{color:var(--ink)}
.rec-amount.inc{color:var(--income-d)}
.rec-sign{font-size:15px;margin-right:1px}
.cat-chip{display:inline-block;padding:2px 7px;border-radius:5px;font-size:13px}
.type-badge{display:inline-block;padding:1px 6px;border-radius:4px;font-size:12px;font-family:var(--ft)}
.type-badge.exp{background:var(--blush-p);color:var(--blush)}
.type-badge.inc{background:var(--income-p);color:var(--income-d)}

/* Category list (明細第2層) */
.cat-group-item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid rgba(0,0,0,.05);cursor:pointer;transition:opacity .1s}
.cat-group-item:active{opacity:.7}
.cat-group-item:last-child{border-bottom:none}
.cg-icon{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.cg-info{flex:1;min-width:0}
.cg-name{font-size:17px;color:var(--ink);font-family:var(--ft)}
.cg-count{font-size:14px;color:var(--ink-s);margin-top:2px}
.cg-right{text-align:right;flex-shrink:0}
.cg-amount{font-family:var(--ft);font-size:18px;color:var(--ink)}

/* Breadcrumb / back row */
.back-row{display:flex;align-items:center;gap:6px;padding:0 0 12px;cursor:pointer;font-family:var(--ft);font-size:16px;color:var(--sage-d)}
.back-row span{font-size:16px}

/* Filter tabs */
.filter-tabs{display:flex;gap:6px;margin-bottom:12px}
.ftab{flex:1;padding:8px;border-radius:10px;border:1.5px solid rgba(0,0,0,.1);background:var(--white);font-family:var(--ft);font-size:16px;color:var(--ink-m);cursor:pointer;text-align:center;transition:all .15s}
.ftab.on-all{background:var(--sage-p);border-color:var(--sage);color:var(--sage-d)}
.ftab.on-exp{background:var(--blush-p);border-color:var(--blush);color:var(--blush)}
.ftab.on-inc{background:var(--income-p);border-color:var(--income);color:var(--income-d)}

/* Chart tabs */
.chart-main-tabs{display:flex;gap:8px;margin-bottom:14px}
.ctab-main{flex:1;padding:9px;border-radius:10px;border:1.5px solid rgba(0,0,0,.08);background:var(--white);font-family:var(--ft);font-size:16px;color:var(--ink-m);cursor:pointer;text-align:center}
.ctab-main.on-cashflow{background:var(--sage-p);border-color:var(--sage);color:var(--sage-d)}
.ctab-main.on-assets{background:var(--income-p);border-color:var(--income);color:var(--income-d)}
.chart-tabs{display:flex;gap:8px;margin-bottom:14px}
.ctab{flex:1;padding:9px;border-radius:10px;border:1.5px solid rgba(0,0,0,.08);background:var(--white);font-family:var(--ft);font-size:16px;color:var(--ink-m);cursor:pointer;text-align:center}
.ctab.on-exp{background:var(--blush-p);border-color:var(--blush);color:var(--blush)}
.ctab.on-inc{background:var(--income-p);border-color:var(--income);color:var(--income-d)}

/* Budget */
.bud-row{padding:11px 0;border-bottom:1px solid rgba(0,0,0,.05)}
.bud-row:last-child{border-bottom:none}
.bud-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.bud-emoji{font-size:18px;width:22px;text-align:center;flex-shrink:0}
.bud-name{font-size:15px;color:var(--ink);flex:1;font-family:var(--ft)}
.bud-amounts{display:flex;align-items:baseline;gap:2px;font-family:var(--ft)}
.bud-spent{font-size:15px}
.bud-sep{font-size:13px;color:var(--ink-s);margin:0 1px}
.bud-target{width:60px;border:none;background:transparent;font-size:15px;color:var(--ink-s);outline:none;font-family:var(--ft);text-align:right;border-bottom:1px dashed rgba(0,0,0,.18)}
.bud-bar-wrap{height:6px;background:var(--bg);border-radius:4px;overflow:hidden;margin-bottom:4px}
.bud-bar{height:100%;border-radius:4px;transition:width .5s}
.bud-footer{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-s)}

/* Chart */
.chart-legend{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.cl-row{display:flex;align-items:center;gap:8px}
.cl-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.cl-name{flex:1;font-size:16px;color:var(--ink-m);font-family:var(--ft)}
.cl-pct{font-size:15px;color:var(--ink-s);min-width:28px;text-align:right}
.cl-amt{font-size:15px;color:var(--ink);min-width:68px;text-align:right;font-family:var(--ft)}
.line-wrap{position:relative;height:140px;margin-top:6px}

/* Sheet */
.sheet-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(62,58,54,.45);z-index:100;opacity:0;pointer-events:none;transition:opacity .25s;display:flex;align-items:flex-end;max-width:480px;margin:0 auto}
.sheet-overlay.open{opacity:1;pointer-events:all}
.sheet{width:100%;background:var(--white);border-radius:28px 28px 0 0;padding-bottom:calc(env(safe-area-inset-bottom,0px)+12px);transform:translateY(100%);transition:transform .32s cubic-bezier(.32,.72,0,1);max-height:92dvh;display:flex;flex-direction:column}
.sheet-overlay.open .sheet{transform:translateY(0)}
.sheet-handle{width:40px;height:4px;background:rgba(0,0,0,.12);border-radius:2px;margin:12px auto 0;flex-shrink:0}
.sheet-title{font-family:var(--ft);font-size:21px;color:var(--ink);padding:12px 20px 6px;letter-spacing:1px;flex-shrink:0}
.sheet-scroll{overflow-y:auto;padding:4px 20px 6px;flex:1}
.sheet-scroll::-webkit-scrollbar{display:none}

/* Type toggle */
.type-toggle{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.type-btn{padding:10px;border-radius:var(--rs);font-family:var(--ft);font-size:17px;cursor:pointer;border:1.5px solid rgba(0,0,0,.1);background:var(--bg);color:var(--ink-m);transition:all .15s;text-align:center}
.type-btn.ae{background:var(--blush-p);border-color:var(--blush);color:var(--blush)}
.type-btn.ai{background:var(--income-p);border-color:var(--income);color:var(--income-d)}

/* Form */
.f-group{margin-bottom:14px}
.f-label{font-size:13px;color:var(--ink-s);letter-spacing:1.5px;margin-bottom:6px;display:block;font-family:var(--ft)}
.f-input{width:100%;padding:12px 14px;border:1px solid rgba(0,0,0,.1);border-radius:var(--rs);font-family:var(--fb);font-size:15px;color:var(--ink);background:var(--surface);outline:none;-webkit-appearance:none}
.f-input:focus{border-color:var(--sage)}
.f-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f-select{width:100%;padding:12px 14px;border:1px solid rgba(0,0,0,.1);border-radius:var(--rs);font-family:var(--fb);font-size:15px;color:var(--ink);background:var(--surface);outline:none;-webkit-appearance:none;appearance:none}
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cat-pick{padding:9px 4px;text-align:center;border-radius:10px;font-size:10px;cursor:pointer;border:1.5px solid transparent;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--ft);transition:border-color .15s}
.cat-pick .cp-emoji{font-size:19px;line-height:1}
.cat-sec-lbl{font-size:10px;color:var(--ink-s);letter-spacing:2px;margin-bottom:7px;font-family:var(--ft)}
.f-actions{display:flex;gap:10px;padding:10px 20px 4px;flex-shrink:0}
.f-cancel{flex:1;padding:13px;background:var(--bg);border:none;border-radius:var(--rs);font-family:var(--ft);font-size:14px;color:var(--ink-m);cursor:pointer}
.f-save{flex:2;padding:13px;background:var(--sage);border:none;border-radius:var(--rs);font-family:var(--ft);font-size:14px;color:#fff;cursor:pointer;letter-spacing:1px}
.f-save:disabled{opacity:.5}
.f-error{font-size:12px;color:#d9534f;margin-top:4px;min-height:18px;visibility:hidden;opacity:0;transition:opacity .2s}
.f-error.active{visibility:visible;opacity:1}
.f-input.invalid{border:1px solid #d9534f;box-shadow:0 0 0 4px rgba(217,83,79,.12)}

/* Detail */
.detail-header{text-align:center;padding:12px 0 18px}
.detail-icon{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 10px}
.detail-amount{font-family:var(--ft);font-size:28px}
.detail-field{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid rgba(0,0,0,.05)}
.detail-field:last-of-type{border-bottom:none}
.df-label{font-size:12px;color:var(--ink-s);font-family:var(--ft)}
.df-val{font-size:13px;color:var(--ink);text-align:right;max-width:65%;word-break:break-all;font-family:var(--ft)}
.btn-edit{flex:1;padding:12px;background:var(--sage-p);border:1.5px solid var(--sage-l);border-radius:var(--rs);font-family:var(--ft);font-size:13px;color:var(--sage-d);cursor:pointer}
.btn-del{flex:1;padding:12px;background:var(--blush);border:1.5px solid var(--blush-l);border-radius:var(--rs);font-family:var(--ft);font-size:13px;color:#fff;cursor:pointer}

/* Confirm */
.confirm-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(62,58,54,.45);z-index:200;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;max-width:480px;margin:0 auto}
.confirm-overlay.open{opacity:1;pointer-events:all}
.confirm-box{background:var(--white);border-radius:22px;padding:26px 22px;width:290px;text-align:center}
.confirm-box h3{font-family:var(--ft);font-size:16px;color:var(--ink);margin-bottom:8px}
.confirm-box p{font-size:12px;color:var(--ink-s);margin-bottom:20px;line-height:1.8}
.confirm-acts{display:flex;gap:10px}
.cb-cancel{flex:1;padding:12px;background:var(--bg);border:none;border-radius:var(--rs);font-family:var(--ft);font-size:13px;color:var(--ink-m);cursor:pointer}
.cb-del{flex:1;padding:12px;background:var(--blush);border:none;border-radius:var(--rs);font-family:var(--ft);font-size:13px;color:#fff;cursor:pointer}

.toast{position:fixed;bottom:calc(var(--nav-h)+10px);left:50%;transform:translateX(-50%) translateY(8px);background:rgba(62,58,54,.92);color:#fff;padding:9px 18px;border-radius:20px;font-size:12px;letter-spacing:1px;opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap;z-index:300;font-family:var(--ft)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty-state{text-align:center;padding:36px 20px;color:var(--ink-s);font-size:13px;letter-spacing:1px;line-height:2;font-family:var(--ft)}

/* ── Accounts ── */
.acct-scroll-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:0 16px 4px;display:flex;gap:10px;margin-bottom:4px}
.acct-scroll-wrap::-webkit-scrollbar{display:none}
.acct-card{flex-shrink:0;width:155px;border-radius:16px;padding:14px;position:relative;overflow:hidden;cursor:pointer;transition:transform .15s}
.acct-card:active{transform:scale(.97)}
.acct-card::before{content:'';position:absolute;top:-20px;right:-20px;width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.15)}
.acct-icon{font-size:20px;margin-bottom:8px}
.acct-name{font-size:12px;color:rgba(255,255,255,.85);font-family:var(--ft);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct-bal{font-family:var(--ft);font-size:20px;color:#fff;font-weight:400}
.acct-bal-cur{font-size:12px;opacity:.8;margin-right:2px}
.acct-sub{font-size:10px;color:rgba(255,255,255,.65);margin-top:3px}
.acct-month-net{font-size:10px;margin-top:5px;opacity:.85;font-family:var(--ft)}
.acct-add{flex-shrink:0;width:100px;border-radius:16px;border:2px dashed rgba(0,0,0,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;background:transparent;padding:14px;min-height:108px}
.acct-add-icon{font-size:22px;color:var(--ink-s)}
.acct-add-lbl{font-size:11px;color:var(--ink-s);font-family:var(--ft)}
.color-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:6px}
.color-dot{width:32px;height:32px;border-radius:50%;cursor:pointer;border:2.5px solid transparent;transition:all .15s}
.color-dot.sel{border-color:var(--ink);transform:scale(1.1)}

/* ── Swipe gesture on rec-item ── */
.swipe-wrap{position:relative;overflow:hidden;border-bottom:1px solid rgba(0,0,0,.05)}
.swipe-wrap:last-child{border-bottom:none}
.swipe-actions{position:absolute;right:0;top:0;bottom:0;display:flex;align-items:stretch}
.swipe-edit{background:var(--sage);width:70px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;cursor:pointer;font-family:var(--ft)}
.swipe-del{background:var(--blush);width:70px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;cursor:pointer;font-family:var(--ft)}
.swipe-inner{background:var(--white);transform:translateX(0);transition:transform .25s;cursor:pointer}
.swipe-wrap .rec-item{border-bottom:none;padding-bottom:11px}

/* ── Cleared badge ── */
.cleared-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--sage);margin-left:4px;vertical-align:middle}
.uncleared-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--blush-l);margin-left:4px;vertical-align:middle}

/* ── Custom Calc Keyboard ── */
.calc-kb{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:#d1ccc7;padding:6px 3px calc(env(safe-area-inset-bottom,0px) + 6px) 3px;z-index:500;display:none;transform:translateY(100%);transition:transform .28s cubic-bezier(.32,.72,0,1);box-shadow:0 -1px 0 rgba(0,0,0,.12)}
.calc-kb.open{display:block;transform:translateY(0)}
.calc-display-bar{background:var(--surface);height:44px;margin:0 3px 6px;border-radius:10px;display:flex;align-items:center;justify-content:space-between;padding:0 14px}
.calc-display-expr{font-family:var(--ft);font-size:13px;color:var(--ink-s);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.calc-display-val{font-family:var(--ft);font-size:20px;color:var(--ink);margin-left:8px}
.ck-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;padding:0 3px}
.ck{height:54px;border-radius:9px;border:none;font-family:var(--ft);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:filter .1s;-webkit-tap-highlight-color:transparent;box-shadow:0 1px 0 rgba(0,0,0,.25)}
.ck:active{filter:brightness(.88)}
.ck.num{background:#faf8f5;color:var(--ink)}
.ck.op{background:#b5b0aa;color:#fff;font-size:22px}
.ck.fn{background:#c8c3be;color:var(--ink);font-size:16px}
.ck.eq{background:var(--sage);color:#fff}
.ck.del-k{background:#c8c3be;color:var(--ink);font-size:18px}
.ck.done{background:var(--sage-d);color:#fff;font-size:15px;letter-spacing:.5px}
.ck.zero{grid-column:span 2;justify-content:flex-start;padding-left:28px}

/* ── Month ── */
function mlbl(y,m){return`${y}/${String(m).padStart(2,'0')}`}
function prevMonth(y,m){return m===1?{y:y-1,m:12}:{y,m:m-1}}
function nextMonth(y,m){return m===12?{y:y+1,m:1}:{y,m:m+1}}

function updMonths(){
  const prev=prevMonth(cy,cm),next=nextMonth(cy,cm);
  const sliderHTML=`
    <div class="ms-item" onclick="chMonth(-1)">${mlbl(prev.y,prev.m)}</div>
    <div class="ms-item active">${mlbl(cy,cm)}</div>
    <div class="ms-item" onclick="chMonth(1)">${mlbl(next.y,next.m)}</div>`;
  ['slider-home','slider-rec','slider-chart'].forEach(id=>{
    const el=document.getElementById(id);if(el)el.innerHTML=sliderHTML;
  });
}
function chMonth(d){
  if(d===-1){const p=prevMonth(cy,cm);cy=p.y;cm=p.m;}
  else{const n=nextMonth(cy,cm);cy=n.y;cm=n.m;}
  updMonths();loadData();
}
updMonths();

/* Fix: fetch expenses separately to avoid clone issue */
async function loadData(){
  const start=`${cy}-${String(cm).padStart(2,'0')}-01`;
  const end=cm===12?`${cy+1}-01-01`:`${cy}-${String(cm+1).padStart(2,'0')}-01`;
  const d12=new Date(cy,cm-1-11,1);
  const start12=`${d12.getFullYear()}-${String(d12.getMonth()+1).padStart(2,'0')}-01`;

  try{
    const [j1,j2,j3,j4]=await Promise.all([
      fetch(`${SB}/rest/v1/expenses?select=*&created_at=gte.${start}&created_at=lt.${end}&order=created_at.desc`,{headers:H}).then(r=>r.ok?r.json():[]),
      fetch(`${SB}/rest/v1/accounts?select=*&order=created_at.asc`,{headers:H}).then(r=>r.ok?r.json():[]),
      fetch(`${SB}/rest/v1/rpc/get_monthly_summary`,{method:'POST',headers:H,body:JSON.stringify({p_start_date:start12,p_end_date:end})}).then(r=>r.ok?r.json():[]),
      fetch(`${SB}/rest/v1/expenses?select=id,amount,type,source`,{headers:H}).then(r=>r.ok?r.json():[])
    ]);
    exps=Array.isArray(j1)?j1:[];
    accounts=Array.isArray(j2)?j2:[];
    monthSummary=Array.isArray(j3)?j3:[];
    allExps=Array.isArray(j4)?j4:[];
  }catch(err){showToast('載入失敗: '+err.message);}

  render(curScr);
  if(curScr==='records'&&recBank)renderRecords(null,null,recBank);
}

function stats(){
  const income=exps.filter(e=>isInc(e)).reduce((s,e)=>s+parseFloat(e.amount||0),0);
  const expense=exps.filter(e=>!isInc(e)).reduce((s,e)=>s+parseFloat(e.amount||0),0);
  const bycat={};exps.filter(e=>!isInc(e)).forEach(e=>{const c=e.category||'其他';bycat[c]=(bycat[c]||0)+parseFloat(e.amount||0)});
  const byIncCat={};exps.filter(e=>isInc(e)).forEach(e=>{const c=e.category||'其他收入';byIncCat[c]=(byIncCat[c]||0)+parseFloat(e.amount||0)});
  return{income,expense,net:income-expense,bycat,byIncCat};
}

function shrinkOtherPageFonts(screenId){
  if(screenId==='records')return;
  const root=document.getElementById('sc-'+screenId);
  if(!root)return;
  root.querySelectorAll('*').forEach(el=>{
    if(el.closest('.month-slider'))return;
    if(el.dataset.fontsShrunk==='true')return;
    const fs=window.getComputedStyle(el).fontSize;
    if(fs&&fs.endsWith('px')){
      const size=parseFloat(fs);
      if(size>2){
        el.style.fontSize=`${Math.max(size-2,1)}px`;
      }
    }
    el.dataset.fontsShrunk='true';
  });
}

/* ── HOME ── */
function acctKey(a){
  return a.linked_source||a.name||'';
}
function txnKey(e){
  const src=e.source||'';
  const pay=e.payment_method||'';
  return `${src}|${pay}`;
}
function matchesAccount(a,e){
  const key=acctKey(a);
  if(!key) return false;
  const txKey=txnKey(e);
  if(key.includes('|')){
    return txKey===key;
  }
  return (e.source||'')===key;
}
function calcAcctBalance(a){
  // 帳戶餘額 = initial_balance + 所有時間(收入 - 支出) for this account's source/payment_method
  const relevant=allExps.filter(e=>matchesAccount(a,e));
  const totalInc=relevant.filter(e=>isInc(e)).reduce((s,e)=>s+parseFloat(e.amount||0),0);
  const totalExp=relevant.filter(e=>!isInc(e)).reduce((s,e)=>s+parseFloat(e.amount||0),0);
  return (parseFloat(a.initial_balance||a.balance||0)) + totalInc - totalExp;
}

/* swipe state */
let _swX=0,_swEl=null;
function swipeStart(ev,id){_swX=ev.touches[0].clientX;_swEl=id;}
function swipeMove(ev,id){
  const dx=ev.touches[0].clientX-_swX;
  if(dx<-10){ev.preventDefault();const el=document.getElementById('si-'+id);if(el)el.style.transform=`translateX(${Math.max(dx,-140)}px)`;}
}
function swipeEnd(ev,id){
  const el=document.getElementById('si-'+id);if(!el)return;
  const tx=parseFloat(el.style.transform.replace('translateX(',''))||0;
  if(tx<-70){el.style.transform='translateX(-140px)';}
  else{el.style.transform='translateX(0)';}
  _swEl=null;
}

    const iAmt=fil.filter(e=>isInc(e)).reduce((s,e)=>s+parseFloat(e.amount||0),0);

      <div class="card" style="margin-bottom:0">
        <div class="card-row"><span class="card-title">${BANK_EMOJI[bk]||'💳'} ${bk}</span><span style="font-size:11px;color:var(--ink-s)">${fil.length} 筆</span></div>

        <div class="ftab" onclick="renderRecords('income')">收入<div style="font-size:10px;margin-top:2px;opacity:.7">NT$${fmt(iT)}</div></div>
      </div>

        ${exps.slice(0,8).map(swipeHTML).join('')||'<div class="empty-state">這個月沒有記錄 ✦</div>'}
        ${exps.length>8? '<div style="text-align:center;padding:10px 0 0;font-size:12px;color:var(--sage-d);cursor:pointer;font-family:var(--ft)" onclick="recLevel=2;recType=\'all\';recCat=null;renderRecords()">查看全部 ' + exps.length + ' 筆 →</div>' : ''}

    const isExpView=recType!=='income';

    filtered.forEach(e=>{const c=e.category||'其他';bycat[c]=(bycat[c]||0)+parseFloat(e.amount||0);catCount[c]=(catCount[c]||0)+1;});
    const catRows=Object.entries(cats).filter(([n])=>bycat[n]>0).sort((a,b)=>(bycat[b[0]]||0)-(bycat[a[0]]||0)).map(([n,ci])=>{

}

/* ── CHART (RPC-powered monthly bar+line) ── */
function getPast12Months(){
  const months=[];
  for(let i=11;i>=0;i--){const d=new Date(cy,cm-1-i,1);months.push(`${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}`);}
  return months;
}

function getSavingsTrend(){
  return getPast12Months().map(m=>{
    const row=monthSummary.find(r=>r.year_month===m)||{total_expense:0,total_income:0};
    return{month:m,savings:parseFloat(row.total_income)-parseFloat(row.total_expense)};
  });
}

    return`<div class="cl-row"><div class="cl-dot" style="background:${c.c}"></div><div class="cl-name"><i class="fas ${c.e}"></i> ${k}</div><div class="cl-pct">${p}%</div><div class="cl-amt">NT$${fmt(byCatData[k])}</div></div>`;

        <div class="ctab${chartTab==='income'?' on-inc':''}" onclick="chartTab='income';renderChart()">收入圖表</div>

      <div class="chart-legend">${legend||'<div class="empty-state">尚無資料</div>'}</div>
    </div>

      <div class="card-row"><span class="card-title">近12個月收支</span></div>
      <div class="line-wrap" style="height:180px"><canvas id="lc"></canvas></div>
    </div>`:`<div class="card">
      <div class="card-row"><span class="card-title">存錢趨勢</span><span style="font-size:10px;color:var(--ink-s)">收入 − 支出</span></div>
      <div class="line-wrap" style="height:140px"><canvas id="sc"></canvas></div>

      <div class="line-wrap" style="height:140px"><canvas id="ac"></canvas></div>
    </div>`}`;

  setTimeout(()=>{
    if(chartInst.d)chartInst.d.destroy();
    if(chartInst.l)chartInst.l.destroy();
    if(chartInst.s)chartInst.s.destroy();

      const tOpts={responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{font:{size:10},color:'#a8a09a'}},y:{grid:{color:'rgba(0,0,0,.04)'},ticks:{font:{size:10},color:'#a8a09a',callback:v=>v>=1000?(v/1000).toFixed(0)+'k':v}}}};

      const totalInitial=accounts.reduce((s,a)=>s+parseFloat(a.initial_balance||a.balance||0),0);
      const assetByMonth=months.map(m=>{
        const [y,mo]=m.split('/').map(Number);

        return Math.round(totalInitial+cumNet);

    }
  },80);
}

async function saveExpense(){
  const amount=parseFloat(document.getElementById('f-amount').value)||0;
  const points=parseInt(document.getElementById('f-points').value)||0;
  if(amount<0){showToast('金額不能為負數');return;}
  if(amount===0&&points<=0){showToast('請輸入金額或點數');return;}
  const store=document.getElementById('f-store').value.trim()||'手動輸入';
  const note=document.getElementById('f-note').value.trim()||null;
  const payment_method=document.getElementById('f-payment').value||null;
  const source=document.getElementById('f-source').value||null;
  const dateVal=document.getElementById('f-date').value;
  const created_at=dateVal?new Date(dateVal+'T12:00:00+08:00').toISOString():new Date().toISOString();
  const eid=document.getElementById('edit-id').value;
  const btn=document.getElementById('save-btn');btn.disabled=true;btn.textContent='儲存中…';
  try{
    const body=JSON.stringify({amount,points,store,category:selCat,type:selType,payment_method,source,created_at,note,original_text:'手動新增'});
    const url=eid?`${SB}/rest/v1/expenses?id=eq.${eid}`:`${SB}/rest/v1/expenses`;
    const r=await fetch(url,{method:eid?'PATCH':'POST',headers:{...H,Prefer:'return=minimal'},body});
    if(!r.ok){
      let errorMessage='';
      try{errorMessage=await r.text();}catch(e){errorMessage=r.statusText;}
      throw new Error(`HTTP ${r.status}${errorMessage?(' '+errorMessage):''}`);
    }
    closeAdd();showToast(eid?'已更新 ✓':(selType==='income'?'收入記錄 ✓':'記帳成功 ✓'));await loadData();
  }catch(err){showToast('儲存失敗: '+err.message)}
  finally{btn.disabled=false;btn.textContent=document.getElementById('edit-id').value?'儲存':'記帳'}
}

/* ── Accounts ── */
function buildColorGrid(){document.getElementById('color-grid').innerHTML=ACCT_COLORS.map(c=>`<div class="color-dot${c===selAcctColor?' sel':''}" style="background:${c}" onclick="pickAcctColor('${c}')"></div>`).join('');}
function pickAcctColor(c){selAcctColor=c;buildColorGrid();}
buildColorGrid();

function clearAcctNameError(){
  const err=document.getElementById('acct-name-error');
  const input=document.getElementById('acct-name');
  if(err){err.textContent='';err.classList.remove('active');}
  if(input){input.classList.remove('invalid');}
}

function openAcctEdit(id){
  const a=id?accounts.find(x=>x.id===id):null;
  document.getElementById('acct-edit-title').textContent=a?'編輯帳戶':'新增帳戶';
  document.getElementById('acct-edit-id').value=a?a.id:'';
  document.getElementById('acct-name').value=a?a.name:'';
  clearAcctNameError();
  document.getElementById('acct-icon').value=a?a.icon:'🏦';
  document.getElementById('acct-type').value=a?a.type:'bank';
  if(a && a.linked_source && a.linked_source.includes('|')){
    const [src,pay]=a.linked_source.split('|');
    document.getElementById('acct-source').value=src;
    document.getElementById('acct-payment').value=pay;
  } else {
    document.getElementById('acct-source').value=a?a.linked_source||a.name:'';
    document.getElementById('acct-payment').value='';
  }
  document.getElementById('acct-balance').value=a?a.initial_balance||a.balance||'':'';
  document.getElementById('acct-note').value=a?a.note||'':'';
  selAcctColor=a?a.color:ACCT_COLORS[0];buildColorGrid();
  document.getElementById('acct-edit-overlay').classList.add('open');
}
function closeAcctEdit(){document.getElementById('acct-edit-overlay').classList.remove('open')}

async function saveAccount(){
  const nameInput=document.getElementById('acct-name');
  const name=nameInput.value.trim();
  clearAcctNameError();
  if(!name){
    const err=document.getElementById('acct-name-error');
    if(err){err.textContent='請輸入帳戶名稱';err.classList.add('active');}
    if(nameInput){nameInput.classList.add('invalid');nameInput.focus();}
    showToast('請輸入帳戶名稱');
    return;
  }
  const eid=document.getElementById('acct-edit-id').value;
  const btn=document.getElementById('acct-save-btn');
  if(!btn){showToast('按鈕元素未找到');return;}
  btn.disabled=true;
  const originalTxt=btn.textContent;
  const sourceVal=document.getElementById('acct-source').value.trim()||name;
  btn.textContent='儲存中…';
  const paymentVal=document.getElementById('acct-payment').value.trim();
  const linkedSource=paymentVal?`${sourceVal}|${paymentVal}`:sourceVal;
  const body=JSON.stringify({
    name,
    icon:document.getElementById('acct-icon').value.trim()||'🏦',
    type:document.getElementById('acct-type').value,
    initial_balance:parseFloat(document.getElementById('acct-balance').value)||0,
    linked_source:linkedSource,
    color:selAcctColor,
    note:document.getElementById('acct-note').value.trim()||null
  });
  try{
    const url=eid?`${SB}/rest/v1/accounts?id=eq.${eid}`:`${SB}/rest/v1/accounts`;
    const r=await fetch(url,{method:eid?'PATCH':'POST',headers:{...H,Prefer:'return=minimal'},body});
    if(!r.ok){
      let errorMessage='';
      try{errorMessage=await r.text();}catch(e){errorMessage=r.statusText;}
      throw new Error(`HTTP ${r.status}${errorMessage?(' '+errorMessage):''}`);
    }
    closeAcctEdit();showToast(eid?'已更新 ✓':'帳戶已新增 ✓');await loadData();
  }catch(err){showToast('儲存失敗: '+err.message)}
  finally{btn.disabled=false;btn.textContent=originalTxt;}
}

/* ── Custom Calc Keyboard ── */
let ckField=null,ckExpr='',ckCurrent='0',ckOp_=null,ckPrev=null,ckJustEq=false;
function openCalcKb(field){
  ckField=field;
  const val=document.getElementById('f-'+field).value||'0';
  ckCurrent=val;ckExpr='';ckOp_=null;ckPrev=null;ckJustEq=false;
  ckRefresh();
  document.getElementById('calc-kb').classList.add('open');
  document.querySelector('#add-overlay .sheet').style.paddingBottom='calc(env(safe-area-inset-bottom,0px) + 290px)';
}
function closeCalcKb(){
  document.getElementById('calc-kb').classList.remove('open');
  const sh=document.querySelector('#add-overlay .sheet');if(sh)sh.style.paddingBottom='';
}
function ckRefresh(){
  document.getElementById('ck-expr').textContent=ckExpr;
  document.getElementById('ck-val').textContent=ckCurrent;
  if(ckField){const v=parseFloat(ckCurrent);document.getElementById('f-'+ckField).value=isNaN(v)?'0':ckCurrent;}
}
function ckNum(n){
  if(ckJustEq){ckCurrent='0';ckExpr='';ckJustEq=false;}
  if(n==='.'&&ckCurrent.includes('.'))return;
  ckCurrent=ckCurrent==='0'&&n!=='.'?n:ckCurrent+n;ckRefresh();
}
function ckOp(op){
  if(ckOp_&&!ckJustEq){const r=calcOp(parseFloat(ckPrev)||0,ckOp_,parseFloat(ckCurrent)||0);ckCurrent=fmtCalc(r);ckExpr=ckCurrent+' '+opSym(op)+' ';}
  else{ckExpr=ckCurrent+' '+opSym(op)+' ';}
  ckPrev=ckCurrent;ckOp_=op;ckCurrent='0';ckJustEq=false;ckRefresh();
}
function ckEq(){
  if(!ckOp_)return;
  const r=calcOp(parseFloat(ckPrev)||0,ckOp_,parseFloat(ckCurrent)||0);
  ckExpr=ckPrev+' '+opSym(ckOp_)+' '+ckCurrent+' =';
  ckCurrent=fmtCalc(r);ckPrev=null;ckOp_=null;ckJustEq=true;ckRefresh();
}
function ckFn(fn){
  if(fn==='AC'){ckCurrent='0';ckExpr='';ckOp_=null;ckPrev=null;ckJustEq=false;}
  else if(fn==='±'){ckCurrent=fmtCalc(-(parseFloat(ckCurrent)||0));}
  else if(fn==='%'){ckCurrent=fmtCalc((parseFloat(ckCurrent)||0)/100);}
  ckRefresh();
}
function ckDel(){ckCurrent=ckCurrent.length<=1?'0':ckCurrent.slice(0,-1);ckRefresh();}
function ckDone(){if(ckOp_)ckEq();closeCalcKb();}
function calcOp(a,op,b){return op==='/'?b?a/b:0:op==='*'?a*b:op==='-'?a-b:a+b;}
function fmtCalc(n){const r=Math.round(n*1e6)/1e6;return String(r);}
function opSym(op){return op==='/'?'÷':op==='*'?'×':op==='-'?'−':'+';}

// 點擊其他區域關閉計算機
document.getElementById('add-overlay').addEventListener('click',ev=>{
  const kb=document.getElementById('calc-kb');
  if(kb.classList.contains('open')&&!kb.contains(ev.target)&&ev.target.id!=='f-amount'&&ev.target.id!=='f-points')closeCalcKb();
});

function overlayTap(ev,id){if(ev.target.id===id)document.getElementById(id).classList.remove('open')}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}

loadData();
</script>
